services:
  vita-lima-web:
    container_name: vita-lima-web
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.local
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - default
      - nginx_proxy

networks:
  nginx_proxy:
    external: true
    name: n8n_default
