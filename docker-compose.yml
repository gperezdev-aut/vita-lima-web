services:
  vita-lima-web:
    container_name: vita-lima-web
    build:
      context: .
      dockerfile: Dockerfile
      # Van en `args` y no solo en `environment` porque el sitio se genera
      # estatico durante el build. Ver el comentario en el Dockerfile.
      args:
        NEXT_PUBLIC_SITE_URL: https://www.vitalimaspa.com
        NEXT_PUBLIC_WHATSAPP: "51907308415"
        NEXT_PUBLIC_SITE_ENV: production
        NEXT_PUBLIC_GA_MEASUREMENT_ID: G-L3PW7G43CY
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SITE_URL: https://www.vitalimaspa.com
      NEXT_PUBLIC_WHATSAPP: "51907308415"
      NEXT_PUBLIC_SITE_ENV: production
      NEXT_PUBLIC_GA_MEASUREMENT_ID: G-L3PW7G43CY
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - default
      - nginx_proxy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  nginx_proxy:
    external: true
    name: n8n_default
