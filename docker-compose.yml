services:
  vita-lima-web:
    container_name: vita-lima-web
    build:
      context: .
      dockerfile: Dockerfile
      # Van en `args` y no solo en `environment` porque el sitio se genera
      # estatico durante el build. Ver el comentario en el Dockerfile.
      args:
        NEXT_PUBLIC_SITE_URL: https://www.vitalimaspa.com
        NEXT_PUBLIC_WHATSAPP: "51907308415"
        NEXT_PUBLIC_SITE_ENV: production
        NEXT_PUBLIC_GA_MEASUREMENT_ID: G-L3PW7G43CY
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SITE_URL: https://www.vitalimaspa.com
      NEXT_PUBLIC_WHATSAPP: "51907308415"
      NEXT_PUBLIC_SITE_ENV: production
      NEXT_PUBLIC_GA_MEASUREMENT_ID: G-L3PW7G43CY
      # Estas dos SÍ van solo aquí y no en `args`: las lee el servidor en
      # tiempo de ejecucion (app/api/reservas), no el build. Ponerlas en
      # `args` ademas las hornearia en la imagen, que es justo lo que no
      # queremos con un secreto. Se toman del entorno del host —del .env
      # que vive en el servidor— para no versionar el secreto aqui.
      N8N_RESERVAS_WEBHOOK_URL: ${N8N_RESERVAS_WEBHOOK_URL:-}
      N8N_RESERVAS_WEBHOOK_SECRET: ${N8N_RESERVAS_WEBHOOK_SECRET:-}
      # Integración servidor-a-servidor de /cita/[token]. Compose falla con
      # un mensaje explícito si falta alguna; nunca pasan como build args ni
      # se exponen con prefijo NEXT_PUBLIC_.
      CAJA_API_URL: ${CAJA_API_URL:?CAJA_API_URL is required}
      CAJA_API_SECRET: ${CAJA_API_SECRET:?CAJA_API_SECRET is required}
      # Bienestar corporativo: solo para la API server-side.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CORPORATE_LEADS_TO: ${CORPORATE_LEADS_TO:-info@vitalimaspa.com}
      CORPORATE_LEADS_FROM: ${CORPORATE_LEADS_FROM:-}
      # Opcional y solo server-side para previews protegidos de Caja.
      CAJA_VERCEL_PROTECTION_BYPASS: ${CAJA_VERCEL_PROTECTION_BYPASS:-}
    volumes:
      # Cache de next/image. Sin volumen, cada `docker compose up --build`
      # recrea el contenedor y nace vacio: los primeros visitantes tras cada
      # despliegue pagan la conversion de ~170 imagenes en CPU del servidor
      # mientras esperan. Con el volumen, el trabajo se hace una sola vez.
      - vita-next-cache:/app/.next/cache
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - default
      - nginx_proxy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  vita-next-cache:

networks:
  nginx_proxy:
    external: true
    name: n8n_default
